[build]
  # The directory where the frontend application lives
  base = "client"
  
  # The command to install dependencies and build the app
  command = "npm install && npm run build"
  
  # The directory that Netlify will deploy (relative to 'base')
  publish = "dist"

[build.environment]
  # Ensure we use a modern Node version
  NODE_VERSION = "22"
